[project]
name = "pf-agent"
version = "0.1.0"
description = "STS Photo Finish — Capture Agent (kamera tepi sungai → slit-scan)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "python-socketio[client]>=5.11",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pf-agent = "pf_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pf_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
