[project]
name = "pf-agent"
version = "0.1.0"
description = "STS Photo Finish — Capture Agent (kamera tepi sungai → slit-scan)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  # opencv-python (bukan -headless): satu paket cv2 yang juga diminta
  # ultralytics — dua paket OpenCV saling menimpa folder cv2.
  "opencv-python>=4.9,<5",
  "python-socketio[client]>=5.11",
  "httpx>=0.27",
  # Membaca kemampuan asli kamera (resolusi & fps maks.) di macOS untuk halaman Pengaturan Kamera.
  "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Filter objek (YOLO). Berat (PyTorch ±1 GB) — hanya bila filter objek dipakai.
# Lisensi ultralytics AGPL-3.0: distribusi tertutup butuh lisensi komersial.
detect = ["ultralytics>=8.3"]

[project.scripts]
pf-agent = "pf_agent.__main__:main"
pf-dataset = "pf_agent.dataset:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pf_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
