# Nginx untuk STS Photo Finish di VPS.
# Salin ke /etc/nginx/sites-available/photofinish, ganti DOMAIN_ANDA,
# lalu jalankan certbot (lihat docs/PANDUAN-VPS.md) untuk HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    # Rekaman slit-scan & foto frame diunggah agent dari lokasi lomba.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # Socket.IO (realtime agent, timing, juri) — wajib untuk WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Koneksi realtime dibiarkan terbuka lama.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
